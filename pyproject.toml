[project]
name = "cohendrix"
version = "0.1.0"
description = "Co-Hendrix server: FastAPI API, schemas and verifier."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "litellm>=1.60",
    "mido>=1.3.3,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server/cohendrix"]

[tool.pytest.ini_options]
testpaths = ["tests/server"]
addopts = "-ra"
filterwarnings = [
    # FastAPI's TestClient still wraps httpx; Starlette now warns about that.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Pydantic warnings about LiteLLM's own TypedDicts.
    "ignore:.*using the `ReadOnly` qualifier:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src/server", "tests/server"]
include = ["src/server/**/*.py", "tests/server/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/server", "tests/server"]
mypy_path = "src/server"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "mido"
ignore_missing_imports = true
